title: Guillaume Dua
tagline: My personal blog.
description: >
  A blog about C++, software-design and project-management.
author:
  name: guillaumedua
  email: mailto:pro.guillaume.dua+blog@gmail.com

url: https://guillaumedua.github.io/publications
baseurl: /publications

remote_theme: hydecorp/hydejack@v9.2.1

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-remote-theme

hydejack:
  no_inline_css: true

styles:
  - /publications/assets/css/custom.css

markdown: kramdown

exclude:
  - README.md
  - notes.md

include:
  - LICENSE
  - PRIVACY.md

# ------------------------------------------------------------

menu:
  - title: Home
    url:   /
  - title: C++
    url:   /tag/cpp/
  - title: Software design
    url:   /tags/software-design/
  - title: Project Management
    url:   /tag/project-management/
  - title: Trip reports
    url:   /tag/trip-report/
  - title: About
    url:   /about/
  - title: Privacy
    url:   /privacy/

# fallbacks
image:               /hydejack/assets/img/nap.jpg
color:               '#4f86aa'

# google_analytics:

# Fonts (CSS font-family values)
font_heading:        "'Roboto Slab', Helvetica, Arial, sans-serif"
font:                "'Noto Sans', Helvetica, Arial, sans-serif"
# The string encoding what fonts to fetch from Google Fonts. See: https://qwtel.com/hydejack/docs/configuration/
google_fonts:        Roboto+Slab:700|Noto+Sans:400,400i,700,700i

copyright:           '&copy; 2025. Licensed under [CC BY-NC-SA 4.0](https://creativecommons.org/licenses/by-nc-sa/4.0/)'
permalink:           pretty
paginate:            5
paginate_path:       '/page-:num/'

collections:
  featured_categories:
    permalink:       /category/:name/
    output:          true
  featured_tags:
    permalink:       /tag/:name/
    output:          true
  projects:
    permalink:       /projects/:path/
    output:          true

gems:
  - jekyll-default-layout
  - jekyll-feed
  - jekyll-optional-front-matter
  - jekyll-paginate
  - jekyll-redirect-from
  - jekyll-relative-links
  - jekyll-sitemap

kramdown:
  footnote_backlink: '&#x21a9;&#xfe0e;'
  math_engine:       mathjax
  math_engine_opts:
    preview:         true
    preview_as_code: true

compress_html:
  comments:          ["<!-- ", " -->"]
  clippings:         all
  endings:           all
  ignore:
    envs:            [development]

sass:
  style:             compressed
