  about: |
    My name is Guillaume, I am a C++ and software architecture enthusiast with over a decade of experience learning, practicing, and teaching C++ and software design.

    My work typically covers coding, codebases health, software architecture and design, tooling, development practices, and project management considerations that directly affect technical outcomes.  
    I specialize in technical audits and recovery missions, helping teams stabilize complex or struggling projects, and establish reliable foundations for new ones.

    I have a strong interest in project management: forecasting, cost tracking, establishing realistic roadmaps, and maintaining progression visibility to avoid tunnel effects and common delivery pitfalls.
    I believe that clear, honest planning is as much a technical discipline as writing good code - and that teams perform best when everyone shares a grounded understanding of where the project stands and where it is going.

    I have a strong interest in code reviews, mentoring, and team coaching, with a focus on enabling developers to grow while helping teams deliver reliable, maintainable, and production-ready software.  
    I regularly teach contemporary C++ and modern software design principles, emphasizing clarity, safety, expressiveness, and long-term maintainability over legacy or cargo-cult practices.

    I deeply care about the health and wellbeing of the people I work with. I believe that with rationalized efforts and a hint of pragmatic empathy,
    psychological safety within a team is not a luxury but a foundation - one that ensures stable velocity, reduces burnout and turnover, allows individuals to do their best work sustainably over time,
    and ultimately deliver value while building a product.

    Over the years, I have acted as a lead developer and technical referent, supported architectural decisions, guided projects through critical phases,
    and coached teams to reliably ship value into production, while also taking part in recruitment processes to help build efficient and sustainable development teams.

