title: Guillaume Dua
tagline: A blog about C++, software-design and project-management.
description: >
  A blog about C++, software-design and project-management.
author: guillaumedua
url: https://guillaumedua.github.io
baseurl: /publications

remote_theme: hydecorp/hydejack@v9.2.1

# optimal ration: 9:16
accent_image: /assets/img/background.png
accent_color: "#181c1f"
# theme_color: "#4a90e2"

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-remote-theme
  - jekyll-paginate
  - jekyll-redirect-from
  - jekyll-default-layout
  - jekyll-optional-front-matter
  - jekyll-relative-links
  - jekyll-sitemap

hydejack:
  no_inline_css: true
  custom_css: true

# styles:
#   - /publications/assets/css/custom.css

markdown: kramdown

exclude:
  - README.md
  - notes.md
  - _posts/2025-03-20-cpp_in_2026.md

include:
  - LICENSE
  - PRIVACY.md

google_analytics: G-BVQYHTFJK5

# ------------------------------------------------------------

feed:
  title: Guillaume Dua - Publications
  description: C++, software design, project-management and conference trip reports

# ------------------------------------------------------------

# WIP:
# - stylished buttons ? https://www.svgbackgrounds.com/elements/svg-buttons/

menu:
  - title: Home
    url: /
  - title: C++
    url: /tag/cpp/
  - title: Software Design
    url: /tag/software-design/
  - title: Project Management
    url: /tag/project-management/
  - title: Trip Reports
    url: /tag/trip-report/
  - title: About
    url: /about/
  - title: Privacy
    url: /PRIVACY/
  - title: Code of Conduct
    url: /CODE_OF_CONDUCT/
  - title: Change log
    url: /CHANGELOG/

# fallbacks
image: /hydejack/assets/img/nap.jpg
color: "#4f86aa"

# google_analytics:

# Fonts (CSS font-family values)
font_heading: "'Roboto Slab', Helvetica, Arial, sans-serif"
font: "'Noto Sans', Helvetica, Arial, sans-serif"
# The string encoding what fonts to fetch from Google Fonts. See: https://qwtel.com/hydejack/docs/configuration/
google_fonts: Roboto+Slab:700|Noto+Sans:400,400i,700,700i

copyright: "&copy; 2025. Licensed under [CC BY-NC-SA 4.0](https://creativecommons.org/licenses/by-nc-sa/4.0/)"
permalink: pretty
paginate: 5
paginate_path: "/page-:num/"

collections:
  featured_categories:
    permalink: /category/:name/
    output: true
  featured_tags:
    permalink: /tag/:name/
    output: true
  projects:
    permalink: /projects/:path/
    output: true

kramdown:
  footnote_backlink: "&#x21a9;&#xfe0e;"
  math_engine: mathjax
  math_engine_opts:
    preview: true
    preview_as_code: true

compress_html:
  comments: ["<!-- ", " -->"]
  clippings: all
  endings: all
  ignore:
    envs: [development]

sass:
  style: compressed
