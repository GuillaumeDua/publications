{% assign author = site.data.authors[site.author] %}
<ul>
  {% if author.social.github %}
    <li><a href="https://github.com/{{ author.social.github }}">GitHub</a></li>
  {% endif %}
  {% if author.social.linkedin %}
    <li><a href="https://www.linkedin.com/in/{{ author.social.linkedin }}">LinkedIn</a></li>
  {% endif %}
  {% if author.social.email %}
    <li><a href="mailto:{{ author.social.email }}">Email</a></li>
  {% endif %}
</ul>
