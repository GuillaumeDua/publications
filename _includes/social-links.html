{% assign author = site.data.authors["site.author"] %}
<nav class="nav-social">
  {% if author.social.github %}
    <a href="https://github.com/{{ author.social.github }}" title="GitHub">
      {% include icon.html icon="github" %}
    </a>
  {% endif %}
  {% if author.social.linkedin %}
    <a href="https://www.linkedin.com/in/{{ author.social.linkedin }}" title="LinkedIn">
      {% include icon.html icon="linkedin" %}
    </a>
  {% endif %}
  {% if author.social.email %}
    <a href="mailto:{{ author.social.email }}" title="Email">
      {% include icon.html icon="email" %}
    </a>
  {% endif %}
</nav>
